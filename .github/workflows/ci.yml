name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend · lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sgc-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sgc-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.txt

      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          encoded_output="$(base64 -w 0 build-output.txt)"
          echo "::error title=Frontend build output::$encoded_output"

  backend:
    name: Backend · checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sgc-backend
    env:
      DJANGO_ENV: development
      DJANGO_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DJANGO_DEBUG: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sgc-backend/requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Run test suite
        run: python -m pytest
